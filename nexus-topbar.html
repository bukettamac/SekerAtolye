<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Nexus Business Top Bar</title>
<style>
  :root{
    --kozmos-moru:#1E1233;
    --ai-pembesi:#FF2E93;
    --aura-mavisi:#6366F1;
    --sis-grisi:#EBEFF5;
  }

  * { box-sizing: border-box; }

  .nexus-topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;              /* alan yetmezse alt satıra geçer */
    gap:6px 10px;
    width:100%;
    padding:6px 14px;
    background:linear-gradient(90deg, var(--kozmos-moru) 0%, var(--aura-mavisi) 100%);
    font-family:"Segoe UI", Arial, sans-serif;
    font-size:13px;
    line-height:1.3;
    text-align:center;
  }

  .nexus-topbar__text{
    color:var(--sis-grisi);
    white-space:nowrap;
  }

  .nexus-topbar__link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:var(--ai-pembesi);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:opacity .2s ease;
  }

  .nexus-topbar__link:hover{
    opacity:.8;
    text-decoration:underline;
  }

  .nexus-topbar__icon{
    width:14px;
    height:14px;
    fill:var(--ai-pembesi);
    flex-shrink:0;
  }
</style>
</head>
<body style="margin:0;">

<div class="nexus-topbar">
  <span class="nexus-topbar__text">Bu site, herhangi bir firmaya değil</span>
  <a href="https://nexusbusiness.tech" target="_blank" rel="noopener noreferrer" class="nexus-topbar__link">
    <svg class="nexus-topbar__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm7.94 9h-3.02c-.1-2.06-.62-3.94-1.42-5.37A8.02 8.02 0 0 1 19.94 11zM12 4.06c1.02 1.16 1.82 3.1 2.02 4.94H9.98c.2-1.84 1-3.78 2.02-4.94zM4.06 13h3.02c.1 2.06.62 3.94 1.42 5.37A8.02 8.02 0 0 1 4.06 13zm0-2a8.02 8.02 0 0 1 4.44-5.37C7.7 7.06 7.18 8.94 7.08 11H4.06zM12 19.94c-1.02-1.16-1.82-3.1-2.02-4.94h4.04c-.2 1.84-1 3.78-2.02 4.94zM9.98 13h4.04c-.1 1.94-.9 3.71-2.02 4.83A7.66 7.66 0 0 1 9.98 13zm4.56 5.37c.8-1.43 1.32-3.31 1.42-5.37h3.02a8.02 8.02 0 0 1-4.44 5.37z"/>
    </svg>
    Nexus Business'e aittir — nexusbusiness.tech
  </a>
</div>

</body>
</html>
